  <rect x="158" y="360" width="160" height="80" rx="8" fill="#0fc6c2" fill-opacity="0.08" stroke="#0fc6c2" stroke-width="1.5"/>
  <text x="172" y="386" font-size="15" font-weight="bold" fill="#0f172a">② 代码生成器</text>
  <text x="172" y="410" font-size="13" fill="#64748b">DDL → CRUD 生成</text>
  <text x="172" y="430" font-size="13" fill="#94a3b8">gen · 表 / 字段模板</text>
  <line x1="238" y1="308" x2="238" y2="356" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3"/>
  <circle cx="238" cy="300" r="9" fill="#0fc6c2"/>

  <rect x="434" y="360" width="160" height="80" rx="8" fill="#0fc6c2" fill-opacity="0.08" stroke="#0fc6c2" stroke-width="1.5"/>
  <text x="448" y="386" font-size="15" font-weight="bold" fill="#0f172a">④ 附加模块</text>
  <text x="448" y="410" font-size="13" fill="#64748b">7 模块 · 22 表</text>
  <text x="448" y="430" font-size="13" fill="#94a3b8">消息/公告/报表</text>
  <line x1="514" y1="308" x2="514" y2="356" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3"/>
  <circle cx="514" cy="300" r="9" fill="#0fc6c2"/>

  <rect x="710" y="360" width="160" height="80" rx="8" fill="#f5319d" fill-opacity="0.08" stroke="#f5319d" stroke-width="1.5"/>
  <text x="724" y="386" font-size="15" font-weight="bold" fill="#0f172a">⑥ 高级可选</text>
  <text x="724" y="410" font-size="13" fill="#64748b">4 个扩展模块</text>
  <text x="724" y="430" font-size="13" fill="#94a3b8">租户/工单/日历</text>
  <line x1="790" y1="308" x2="790" y2="356" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3"/>
  <circle cx="790" cy="300" r="9" fill="#f5319d"/>

  <rect x="986" y="360" width="160" height="80" rx="8" fill="#722ed1" fill-opacity="0.08" stroke="#722ed1" stroke-width="1.5"/>
  <text x="1000" y="386" font-size="15" font-weight="bold" fill="#0f172a">⑧ 3D 可视化</text>
  <text x="1000" y="410" font-size="13" fill="#64748b">8 菜单 · 13 表</text>
  <text x="1000" y="430" font-size="13" fill="#94a3b8">场景/绑定/告警</text>
  <line x1="1066" y1="308" x2="1066" y2="356" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3"/>
  <circle cx="1066" cy="300" r="9" fill="#722ed1"/>

  <!-- 汇总 -->
  <rect x="40" y="480" width="800" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="506" font-size="15" font-weight="bold" fill="#334155">里程碑汇总</text>
  <text x="60" y="530" font-size="13" fill="#64748b">9 个里程碑均已完成；数据规模：5 个 SQL 脚本 · 92 张表 · 24 个业务 App。</text>
  <text x="60" y="552" font-size="13" fill="#64748b">技术栈：Django 4.2 + DRF · MySQL 8（managed=False） · Vue 3 + Vite 5 + Element Plus。</text>
  <text x="60" y="574" font-size="13" fill="#64748b">关键能力：JWT 静默续期 · 权限校验 · 代码生成 · 自研 BPMN · 3D 场景与分享。</text>
  <text x="60" y="594" font-size="13" fill="#64748b">当前未部署：Celery / Redis、MinIO、kkFileView、OnlyOffice（标注预留 / 演示）。</text>

  <!-- 后续规划 -->
  <rect x="900" y="480" width="380" height="120" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="920" y="506" font-size="15" font-weight="bold" fill="#475569">后续规划（未实现）</text>
  <circle cx="928" cy="528" r="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="944" y="533" font-size="13" fill="#64748b">真实定时调度（Redis + Celery）</text>
  <circle cx="928" cy="553" r="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="944" y="558" font-size="13" fill="#64748b">对象存储 / 预览（MinIO / kkFileView）</text>
  <circle cx="928" cy="578" r="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="944" y="583" font-size="13" fill="#64748b">在线协同编辑（OnlyOffice）</text>

  <text x="40" y="620" font-size="13" fill="#94a3b8">来源：仓库真实代码与 docs/*.sql（2026-11）</text>
</svg>
