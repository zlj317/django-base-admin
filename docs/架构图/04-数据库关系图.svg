  <text x="46" y="136" font-size="17" font-weight="bold" fill="#165dff">权限与组织（sys_*）</text>
  <text x="464" y="136" font-size="13" fill="#64748b" text-anchor="end">6 张表</text>

  <rect x="48" y="150" width="180" height="76" rx="8" fill="#ffffff" stroke="#165dff" stroke-opacity="0.4" stroke-width="1.5"/>
