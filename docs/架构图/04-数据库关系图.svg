  <text x="58" y="665" font-size="13" fill="#64748b">model_id FK · biz_key</text>
  <text x="58" y="682" font-size="13" fill="#64748b">status · current_node</text>

  <rect x="268" y="612" width="180" height="76" rx="8" fill="#ffffff" stroke="#722ed1" stroke-opacity="0.4" stroke-width="1.5"/>
