  <text x="278" y="186" font-size="13" fill="#64748b">id BIGINT PK</text>
  <text x="278" y="203" font-size="13" fill="#64748b">dept_id FK · username</text>
  <text x="278" y="220" font-size="13" fill="#64748b">password(bcrypt) · status</text>

  <rect x="48" y="252" width="180" height="76" rx="8" fill="#ffffff" stroke="#165dff" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="58" y="270" font-size="14" font-weight="bold" fill="#0f172a">sys_user_role</text>
  <text x="58" y="288" font-size="13" fill="#64748b">user_id FK</text>
  <text x="58" y="305" font-size="13" fill="#64748b">role_id FK</text>
  <text x="58" y="322" font-size="13" fill="#64748b">联合主键 (user_id, role_id)</text>

  <rect x="268" y="252" width="180" height="76" rx="8" fill="#ffffff" stroke="#165dff" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="278" y="270" font-size="14" font-weight="bold" fill="#0f172a">sys_role</text>
  <text x="278" y="288" font-size="13" fill="#64748b">id BIGINT PK</text>
  <text x="278" y="305" font-size="13" fill="#64748b">role_key · role_name</text>
  <text x="278" y="322" font-size="13" fill="#64748b">data_scope · status</text>

  <rect x="48" y="354" width="180" height="76" rx="8" fill="#ffffff" stroke="#165dff" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="58" y="372" font-size="14" font-weight="bold" fill="#0f172a">sys_role_menu</text>
  <text x="58" y="390" font-size="13" fill="#64748b">role_id FK</text>
  <text x="58" y="407" font-size="13" fill="#64748b">menu_id FK</text>
  <text x="58" y="424" font-size="13" fill="#64748b">联合主键 (role_id, menu_id)</text>

  <rect x="268" y="354" width="180" height="76" rx="8" fill="#ffffff" stroke="#165dff" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="278" y="372" font-size="14" font-weight="bold" fill="#0f172a">sys_menu</text>
  <text x="278" y="390" font-size="13" fill="#64748b">id BIGINT PK · parent_id</text>
  <text x="278" y="407" font-size="13" fill="#64748b">menu_name · perms</text>
  <text x="278" y="424" font-size="13" fill="#64748b">menu_type · path</text>

  <path d="M228,188 L264,188" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
