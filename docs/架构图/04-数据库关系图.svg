  <text x="464" y="496" font-size="13" fill="#64748b" text-anchor="end">6 张表</text>

  <rect x="48" y="510" width="180" height="76" rx="8" fill="#ffffff" stroke="#722ed1" stroke-opacity="0.4" stroke-width="1.5"/>
