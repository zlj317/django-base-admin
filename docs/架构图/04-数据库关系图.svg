  <text x="58" y="203" font-size="13" fill="#64748b">parent_id</text>
  <text x="58" y="220" font-size="13" fill="#64748b">dept_name · status</text>

  <rect x="268" y="150" width="180" height="76" rx="8" fill="#ffffff" stroke="#165dff" stroke-opacity="0.4" stroke-width="1.5"/>
