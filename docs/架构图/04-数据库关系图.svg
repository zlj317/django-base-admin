  <text x="278" y="665" font-size="13" fill="#64748b">instance_id FK</text>
  <text x="278" y="682" font-size="13" fill="#64748b">assignee · status</text>

  <rect x="48" y="714" width="180" height="76" rx="8" fill="#ffffff" stroke="#722ed1" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="58" y="732" font-size="14" font-weight="bold" fill="#0f172a">wf_audit</text>
