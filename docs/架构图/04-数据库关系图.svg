  <path d="M228,392 L264,392" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="246" y="386" font-size="13" fill="#475569" text-anchor="middle">N:1</text>

  <!-- 工作流引擎 -->
