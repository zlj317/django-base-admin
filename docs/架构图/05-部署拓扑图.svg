<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#475569"/>
    </marker>
    <marker id="arrowGray" markerWidth="9" markerHeight="9" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>

  <text x="40" y="54" font-size="28" font-weight="bold" fill="#0f172a">部署拓扑图</text>
  <text x="40" y="82" font-size="14" fill="#64748b">生产链路：浏览器 → Nginx → Gunicorn/Waitress → Django → MySQL 8 · 附开发模式</text>
  <text x="1160" y="54" font-size="13" fill="#64748b" text-anchor="end">实线：已实现 · 虚线：可选/预留</text>

  <text x="40" y="116" font-size="16" font-weight="bold" fill="#334155">生产部署</text>

  <rect x="40" y="150" width="160" height="90" rx="10" fill="#165dff" fill-opacity="0.08" stroke="#165dff" stroke-width="1.5"/>
  <text x="120" y="184" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">浏览器</text>
  <text x="120" y="206" font-size="13" fill="#64748b" text-anchor="middle">Vue 3 单页应用</text>
  <text x="120" y="224" font-size="13" fill="#64748b" text-anchor="middle">HTTP / HTTPS</text>

  <rect x="250" y="150" width="190" height="90" rx="10" fill="#0fc6c2" fill-opacity="0.10" stroke="#0fc6c2" stroke-width="1.5"/>
  <text x="345" y="180" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Nginx</text>
  <text x="345" y="201" font-size="13" fill="#64748b" text-anchor="middle">前端 dist 静态资源</text>
  <text x="345" y="220" font-size="13" fill="#64748b" text-anchor="middle">/api 反向代理</text>

  <rect x="490" y="150" width="200" height="90" rx="10" fill="#722ed1" fill-opacity="0.08" stroke="#722ed1" stroke-width="1.5"/>
  <text x="590" y="180" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Gunicorn / Waitress</text>
  <text x="590" y="201" font-size="13" fill="#64748b" text-anchor="middle">WSGI 应用服务器</text>
  <text x="590" y="220" font-size="13" fill="#64748b" text-anchor="middle">多 worker 承载请求</text>

  <rect x="740" y="140" width="230" height="110" rx="10" fill="#165dff" fill-opacity="0.08" stroke="#165dff" stroke-width="1.5"/>
  <text x="855" y="170" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Django 4.2 + DRF</text>
  <text x="855" y="191" font-size="13" fill="#64748b" text-anchor="middle">24 App · common 基座</text>
  <text x="855" y="210" font-size="13" fill="#64748b" text-anchor="middle">JWT / 权限 / 中间件</text>
  <text x="855" y="229" font-size="13" fill="#64748b" text-anchor="middle">模型 managed=False</text>

  <rect x="1010" y="150" width="150" height="90" rx="10" fill="#ff7d00" fill-opacity="0.10" stroke="#ff7d00" stroke-width="1.5"/>
  <text x="1085" y="180" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">MySQL 8</text>
  <text x="1085" y="201" font-size="13" fill="#64748b" text-anchor="middle">库 gen_admin</text>
  <text x="1085" y="220" font-size="13" fill="#64748b" text-anchor="middle">92 张表</text>

  <path d="M200,195 L246,195" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="223" y="189" font-size="13" fill="#475569" text-anchor="middle">HTTPS</text>

  <path d="M440,195 L486,195" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="463" y="189" font-size="13" fill="#475569" text-anchor="middle">代理</text>

  <path d="M690,195 L736,195" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="713" y="189" font-size="13" fill="#475569" text-anchor="middle">WSGI</text>

  <path d="M970,195 L1006,195" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="988" y="189" font-size="13" fill="#475569" text-anchor="middle">SQL</text>

  <rect x="740" y="285" width="230" height="54" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="855" y="308" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">本地 media / uploads</text>
  <text x="855" y="328" font-size="13" fill="#64748b" text-anchor="middle">附件 / 3D 模型（本地目录）</text>
  <path d="M855,250 L855,281" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="865" y="272" font-size="13" fill="#475569">文件读写</text>

  <!-- 开发模式 -->
  <rect x="40" y="340" width="650" height="200" rx="10" fill="#165dff" fill-opacity="0.04" stroke="#165dff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="60" y="370" font-size="16" font-weight="bold" fill="#165dff">开发模式（当前常用）</text>
  <text x="60" y="392" font-size="13" fill="#64748b">浏览器 → http://localhost:5173</text>

  <rect x="60" y="406" width="230" height="86" rx="8" fill="#ffffff" stroke="#165dff" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="175" y="432" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Vite Dev Server</text>
  <text x="175" y="454" font-size="13" fill="#64748b" text-anchor="middle">端口 5173 · HMR</text>
  <text x="175" y="474" font-size="13" fill="#64748b" text-anchor="middle">/api 代理配置</text>

  <rect x="380" y="406" width="250" height="86" rx="8" fill="#ffffff" stroke="#165dff" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="505" y="432" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">Django runserver</text>
  <text x="505" y="454" font-size="13" fill="#64748b" text-anchor="middle">127.0.0.1:8000</text>
  <text x="505" y="474" font-size="13" fill="#64748b" text-anchor="middle">REST /api/** · 开发调试</text>

  <path d="M290,449 L376,449" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="333" y="441" font-size="13" fill="#475569" text-anchor="middle">/api 代理</text>
  <text x="60" y="518" font-size="13" fill="#64748b">Vite proxy：target http://127.0.0.1:8000，避免开发期跨域</text>

  <!-- 可选/预留 -->
  <rect x="720" y="350" width="440" height="190" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="740" y="378" font-size="16" font-weight="bold" fill="#475569">可选 / 预留（未内置）</text>
  <text x="740" y="399" font-size="13" fill="#64748b">以下组件不在 requirements.txt / settings 中启用</text>

  <rect x="740" y="414" width="10" height="10" rx="2" fill="#94a3b8"/>
  <text x="760" y="424" font-size="13" fill="#334155">Redis + Celery</text>
  <text x="900" y="424" font-size="13" fill="#64748b">定时 / 异步（演示，手动触发）</text>

  <rect x="740" y="444" width="10" height="10" rx="2" fill="#94a3b8"/>
  <text x="760" y="454" font-size="13" fill="#334155">MinIO</text>
  <text x="900" y="454" font-size="13" fill="#64748b">对象存储（当前 storage_type=local）</text>

  <rect x="740" y="474" width="10" height="10" rx="2" fill="#94a3b8"/>
  <text x="760" y="484" font-size="13" fill="#334155">kkFileView</text>
  <text x="900" y="484" font-size="13" fill="#64748b">文件在线预览（预留）</text>

  <rect x="740" y="504" width="10" height="10" rx="2" fill="#94a3b8"/>
  <text x="760" y="514" font-size="13" fill="#334155">OnlyOffice</text>
  <text x="900" y="514" font-size="13" fill="#64748b">在线协同编辑（预留）</text>

  <text x="40" y="590" font-size="15" font-weight="bold" fill="#334155">部署说明</text>
  <text x="40" y="614" font-size="13" fill="#64748b">1. Nginx 托管前端静态资源，并把 /api 反向代理到 Gunicorn / Waitress，再交给 Django。</text>
  <text x="40" y="636" font-size="13" fill="#64748b">2. MySQL 8 为唯一持久化数据源；上传文件落在本地 media / uploads 目录。</text>
  <text x="40" y="658" font-size="13" fill="#64748b">3. 开发环境由 Vite 5173 直接代理至 Django 8000，无需 Nginx 与 Gunicorn。</text>
  <text x="40" y="680" font-size="13" fill="#64748b">4. 虚线框内组件均为可选或预留，涉及功能在界面中标注「演示 / 预留」。</text>

  <text x="40" y="735" font-size="13" fill="#94a3b8">来源：仓库真实代码与 docs/*.sql（2026-11）</text>
</svg>
